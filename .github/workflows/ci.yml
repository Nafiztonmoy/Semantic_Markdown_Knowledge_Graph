name: NexusDocs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Test & Type Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexusdocs_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexusdocs_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -e ./apps/api

      - name: Run Ruff Linting & Formatting Check
        run: |
          ruff check apps/api
          ruff format --check apps/api

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://nexus:nexusdocs_secret@localhost:5432/nexusdocs_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-that-is-at-least-32-bytes-long
        run: |
          pytest apps/api/tests -v

  frontend:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run ESLint
        run: |
          cd apps/web
          npm run lint

      - name: Run TypeScript Type Check
        run: |
          cd apps/web
          npm run type-check

      - name: Run Unit Tests
        run: |
          cd apps/web
          npm run test:run

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd apps/web
          npm run build
